name: Generate Google Merchant Feed

on:
  workflow_dispatch:
  schedule:
    # Todo dia 06:10 UTC (03:10 no Brasil - horario de SP)
    - cron: "10 6 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate feed
        run: |
          python generate_feed.py

      - name: Commit and push updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add google-merchant.xml
          git commit -m "Update google-merchant.xml (auto)" || echo "No changes to commit"
          git push
